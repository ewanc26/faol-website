<!-- ── App Shell ───────────────────────────────────────────── -->
<!-- SvelteKit HTML shell. The framework fills the head and body slots below. -->
<!-- data-sveltekit-preload-data="tap" preloads page data on hover/tap. -->

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
